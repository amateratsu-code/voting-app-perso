apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: ghcr.io/amateratsu-code/voting-app-perso-vote:fc9219e3d888aacd9063e8ee5edcc8abb6a16269
        name: vote
        ports:
        - containerPort: 80
          name: vote
