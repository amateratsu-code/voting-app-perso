apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
  annotations:
    gitops-test: "test-001"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: ghcr.io/amateratsu-code/voting-app-perso-result:latest
        name: result
        ports:
        - containerPort: 80
          name: result
