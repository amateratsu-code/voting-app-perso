apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voting-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-result-strip@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: vote
              port:
                number: 8080
        - path: /result
          pathType: Prefix
          backend:
            service:
              name: result
              port:
                number: 8081